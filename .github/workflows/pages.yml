# Build the campaign website (docs/ + the study rendered from study/*.md) and deploy it to GitHub Pages.
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - study/**
      - scripts/build-site.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish rather than cancel it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Build site
        run: bash scripts/build-site.sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
